name: release
# Publishes to PyPI on a GitHub Release using trusted publishing (no stored password or token).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate author metadata
        run: |
          ! grep -qE 'YOUR-USERNAME|YOUR NAME|AUTHOR NAME|example\.com' pyproject.toml
          grep -qE 'Shiv Supane' pyproject.toml
          grep -qE 'ShivSupane' pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[dev,api]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build distribution
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
