name: release
# Publishes to PyPI on a GitHub Release using trusted publishing (no stored password or token).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate author metadata
        run: |
          ! grep -qE 'YOUR-USERNAME|YOUR NAME|AUTHOR NAME|example\.com' pyproject.toml
          grep -qE 'Shiv Supane' pyproject.toml
          grep -qE 'ShivSupane' pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[dev,api]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build distribution
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Verify release tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY_VER=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "Release tag: $GITHUB_REF_NAME (parsed as $TAG), pyproject.toml version: $PY_VER"
          if [ "$TAG" != "$PY_VER" ]; then
            echo "::error::Tag version ($TAG) does not match pyproject.toml version ($PY_VER)!"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
