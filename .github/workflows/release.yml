name: release
# Publishes to PyPI when you create a GitHub Release. Uses PyPI "trusted publishing", so no password or token is stored.
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse to publish with placeholder metadata
        run: "! grep -qE 'YOUR-USERNAME|YOUR NAME|AUTHOR NAME|example\\.com' pyproject.toml"
      - run: pip install build twine
      - run: python -m unittest discover -s tests
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
