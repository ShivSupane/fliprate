[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fliprate"
version = "1.0.2"
description = "Measure and reduce how often an NLP model changes its answer on messy romanized Hindi/Marathi and other Indian-language text."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shiv Supane", email = "shiv.supane777@gmail.com" }]
keywords = ["nlp", "robustness", "hinglish", "marathi", "indic", "romanized", "testing", "transliteration", "code-mixed"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
api     = ["fastapi>=0.100", "uvicorn>=0.23"]
sklearn = ["scikit-learn>=1.3"]
hf      = ["transformers>=4.36", "torch>=2.1"]
dev     = ["pytest>=7", "scikit-learn>=1.3", "build", "twine", "httpx"]
all     = ["fastapi>=0.100", "uvicorn>=0.23", "scikit-learn>=1.3", "transformers>=4.36", "torch>=2.1"]

[project.scripts]
fliprate = "fliprate.cli:main"

[project.urls]
Homepage  = "https://github.com/ShivSupane/fliprate"
Issues    = "https://github.com/ShivSupane/fliprate/issues"
Changelog = "https://github.com/ShivSupane/fliprate/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fliprate = ["data/*.csv", "web/*.html", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

